services:
  - type: web
    name: pm-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: LOGIN_RATE_LIMIT_WINDOW_MINUTES
        value: 15
      - key: LOGIN_RATE_LIMIT_MAX
        value: 20
